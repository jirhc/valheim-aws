# ─────────────────────────────────────────────────────────────────────────────
# valheim.conf — Server configuration (Terraform template)
#
# On EC2 this file is rendered by Terraform templatefile() and uploaded to S3.
# On Docker it is generated by entrypoint.sh from environment variables.
# ─────────────────────────────────────────────────────────────────────────────
SERVER_NAME="${server_name}"
WORLD_NAME="${world_name}"
SERVER_PASSWORD="${server_password}"
SERVER_PORT="${server_port}"
SERVER_PUBLIC="1"
BEPINEX_ENABLED="${enable_bepinex}"
BEPINEX_VERSION="${bepinex_version}"
ENABLE_CROSSPLAY="${enable_crossplay}"
